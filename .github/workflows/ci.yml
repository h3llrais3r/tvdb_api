name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - python-version: '3.9'
          - python-version: '3.8'
          - python-version: '3.6'
          - python-version: '3.7'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-test.txt
      - run: nosetests --verbose --with-coverage --cover-branches --cover-package=tvdb_api
      - run: coveralls